 details:()=>{const total=shares();const nO=owers().length;return `<div class="ph"><button class="bk" data-act="back" aria-label="Back">${ic('back',18)}</button><h4>New agreement</h4></div><div class="steps"><span class="on">1  Type</span><span class="on">2  Details</span><span>3  Review</span></div><div><p class="hello" style="font-size:22px">Make the details clear.</p><p class="sub">${KINDS[S.d.kind][0]} · add everyone who is part of it.</p></div><label class="fld"><span>Agreement title <em>optional</em></span><input id="d-title" value="${S.d.title}" placeholder="Give this promise a name"></label><div class="sec"><h4>Who’s in it</h4><span class="sub" style="font-size:13px">${S.d.people.length} people</span></div><div class="plist">${S.d.people.map((x,i)=>personRow(x,i,true)).join('')}<button class="addp" data-act="addp">${ic('plus',18)} Add a person</button></div><div class="seg" role="group" aria-label="How is it split?"><button data-act="split" data-v="equal" aria-pressed="${S.d.split==='equal'}">Split equally</button><button data-act="split" data-v="set" aria-pressed="${S.d.split==='set'}">Set each amount</button></div>${S.d.split==='equal'?`<label class="fld"><span>Total amount</span><span class="amtIn big">£<input type="number" inputmode="numeric" min="0" id="d-total" value="${S.d.total||''}"></span></label><p class="sub" style="font-size:13px">${nO?`${nO} ${nO===1?'person owes':'people owe'} ${gbp(Math.floor(total/nO))} each`:'Nobody owes a share yet'}</p>`:`<p class="sub" style="font-size:13px">Total: <b>${gbp(total)}</b></p>`}<label class="fld"><span>Due date</span><button class="datebtn" data-act="date">15 Dec 2026</button></label>${S.d.kind==='custom'?`<p class="warnline">Your own terms must not include interest or anything prohibited. If you are unsure, ask a scholar before you sign.</p>`:''}<div class="spacer"></div>${S.d.err?`<p class="errline" role="alert">${S.d.err}</p>`:''}<button class="btnG" data-act="review">Review draft</button>`},
 review:()=>{const total=shares();return `<div class="ph"><button class="bk" data-act="back" aria-label="Back">${ic('back',18)}</button><h4>New agreement</h4></div><div class="steps"><span class="on">1  Type</span><span class="on">2  Details</span><span class="on">3  Review</span></div><div><p class="hello" style="font-size:22px">${S.d.title||KINDS[S.d.kind][0]}</p><p class="sub">Take a moment to check your draft. Nothing is signed or sent.</p></div><dl class="kv"><dt>Type</dt><dd>${KINDS[S.d.kind][0]}</dd><dt>Total</dt><dd>${gbp(total)}</dd><dt>People</dt><dd>${S.d.people.length}</dd><dt>Currency</dt><dd>British pound (GBP)</dd></dl><div class="plist">${S.d.people.map((x,i)=>personRow(x,i,false)).join('')}</div><p class="sub" style="font-size:13px">Each person gets an invitation and signs the same agreement. It becomes active when everyone has signed, witnesses too.</p><div class="spacer"></div><button class="btnG" data-act="save">Save draft</button>`},
 payby:p=>{const a=S.list.find(x=>x.id===p.id);return `<div class="ph"><button class="bk" data-act="back" aria-label="Back">${ic('back',18)}</button><h4>Who paid?</h4></div><p class="sub">${a.title} · choose who this payment is from. Demo: records £50. It counts once ${owedName(a)} confirms.</p><div class="plist">${a.people.map((x,i)=>x.role!=='owes'?'':`<button class="prow tap" data-act="paid" data-i="${i}" ${x.paid+(x.pending||0)>=x.share?'disabled':''}><span class="pav">${x.name[0]}</span><span class="tx"><span class="t1">${x.you?'You':x.name} ${badge(vOf(x.you?null:x.name))}</span><span class="t2">${gbp(x.paid)} of ${gbp(x.share)} paid${x.pending?` · ${gbp(x.pending)} waiting`:''}</span></span><span class="pamt">${x.paid>=x.share?'Paid':x.paid+(x.pending||0)>=x.share?'Waiting':gbp(x.share-x.paid-(x.pending||0))+' left'}</span></button>`).join('')}</div><div class="spacer"></div>`},
 create:()=>{const set=TYPESETS[S.ts];return `<div class="ph"><button class="bk" data-act="back" aria-label="Close">${ic('back',18)}</button><h4>New agreement</h4></div><div class="steps"><span class="on">1  Type</span><span>2  Details</span><span>3  Review</span></div><div><p class="hello" style="font-size:22px">Every promise starts here.</p><p class="sub">Choose what you would like to record. You can review everything before saving.</p></div>${set.map(k=>{const [l,d,i]=KINDS[k];const on=S.kind===k;return `<button class="kind ${on?'on':''}" data-kind="${k}"><span class="tic">${ic(i)}</span><span class="tx"><span class="t1">${l}</span><span class="t2">${d}</span></span><span class="rad">${on?ic('check',22):''}</span></button>`}).join('')}${LATER[S.ts]?`<p class="sub" style="font-size:13px">${LATER[S.ts]}</p>`:''}<div class="spacer"></div><button class="btnG" data-act="cont">Continue</button>`},
 section:p=>{const l=SECTIONS.find(s=>s[0]===p.k)[1];return `<div class="ph"><button class="bk" data-act="back" aria-label="Back">${ic('back',18)}</button><h4>${l}</h4></div>${listOf(data().filter(a=>a.status===p.k),p.k)}`},
 agreement:p=>{const a=data().find(x=>x.id===p.id)||BASE.find(x=>x.id===p.id);const pc=Math.round(a.paid/a.amt*100);
  const act={overdue:`<button class="btnG" data-act="remind">Send a reminder</button>`,awaiting:`<button class="btnG" data-act="sign">Sign this agreement</button>`,draft:`<button class="btnG" data-act="send">Send for signatures</button>`,active:`<button class="btnG" data-act="pay">Record a payment</button>`,completed:''}[a.status];
  return `<div class="ph"><button class="bk" data-act="back" aria-label="Back">${ic('back',18)}</button><h4>${a.title}</h4></div><span class="st ${a.status}" style="align-self:flex-start">${LABEL[a.status]}</span>${a.people?`<div class="sec"><h4>Who’s in it</h4><span class="sub" style="font-size:13px">${a.people.length} people</span></div><div class="plist">${a.people.map(x=>`<div class="prow"><span class="pav">${x.name[0]}</span><span class="tx"><span class="t1">${x.you?'You':x.name} ${badge(vOf(x.you?null:x.name))}</span><span class="t2">${RLAB[x.role]}${!x.you&&TR[x.name]?` · <button class="trlink" data-act="other" data-n="${x.name}">${trChip(x.name)||'No shared record'}</button>`:''}${x.role==='owes'?` · ${gbp(x.paid)} of ${gbp(x.share)} paid`:''}</span></span>${x.role==='owes'?`<span class="mini"><i style="width:${x.share?Math.round(x.paid/x.share*100):0}%"></i></span>`:''}</div>`).join('')}</div>`:''}<dl class="kv">${a.people?'':`<dt>With</dt><dd>${a.who}</dd>`}<dt>Type</dt><dd>${a.kind}</dd><dt>Amount</dt><dd>${gbp(a.amt)}</dd><dt>Paid</dt><dd>${gbp(a.paid)}</dd><dt>Due</dt><dd>${fmt(a.due)}</dd></dl><div class="prog" aria-label="${pc}% paid"><i style="width:${pc}%"></i></div><p class="sub">${pc}% paid · ${gbp(a.amt-a.paid)} left</p>${pendBlock(a)}${evBlock(a)}<button class="btnO" data-act="docview">${ic('doc',18)} View the agreement copy</button><div class="spacer"></div>${act}${closeRule(a)}`}
};

/* ---------- render ---------- */
const screen=document.getElementById('screen');
/* LOCK 6 V1 · App icon + launch screen + in-app mark - waw letter, green launch (Founder 10 Nov "C · Waw letter", "Green with white mark", "Yes, match the icon (Recommended)", "LOCK it (Recommended)") */
const ICONS={
 C:{name:'Waw letter',svg:(fg,bg,ac)=>`<rect width="100" height="100" fill="${bg}"/><path d="M58 52 C47 54 43 45 47 38 C51 31 63 32 64 42 C66 58 52 72 33 76" fill="none" stroke="${fg}" stroke-width="7" stroke-linecap="round"/><circle cx="70" cy="24" r="4" fill="${ac}"/>`}};
const GREEN='#123f32',MINT='#bddccc';
const iconSvg=(k,px,rad=true)=>`<svg viewBox="0 0 100 100" width="${px}" height="${px}" style="border-radius:${rad?px*0.225:0}px;display:block" aria-label="Wafa app icon">${ICONS[k].svg('#ffffff',GREEN,MINT)}</svg>`;
const markSvg=(k,px,fg,ac)=>`<svg viewBox="0 0 100 100" width="${px}" height="${px}" style="display:block" aria-hidden="true">${ICONS[k].svg(fg,'transparent',ac)}</svg>`;
function springboard(){
  const tile=i=>`<span class="sbapp"><span class="sbi" style="background:${['#d9dfdc','#cfd8e3','#e4dccf','#d6e1d4','#e1d6dc','#d4dbe4'][i%6]}"></span><span class="sbl">&nbsp;</span></span>`;
  return `<div class="spring"><div class="sbgrid">${Array.from({length:11},(_,i)=>tile(i)).join('')}<button class="sbapp" data-act="launch" aria-label="Open Wafa">${iconSvg(S.icon,62)}<span class="sbl">Wafa</span></button>${Array.from({length:8},(_,i)=>tile(i+3)).join('')}</div>
   <div class="sbsmall"><span>Small sizes</span><div>${[40,29,20].map(n=>iconSvg(S.icon,n)).join('')}</div></div>
   <div class="sbdock">${[0,1,2,3].map(i=>`<span class="sbi" style="background:${['#cfd8e3','#d6e1d4','#e4dccf','#d9dfdc'][i]}"></span>`).join('')}</div></div>`;
}
function splash(){
  const dark=S.splash==='G';
  return `<div class="splash" style="background:${dark?GREEN:'#ffffff'}">${markSvg(S.icon,dark?132:120,dark?'#ffffff':GREEN,dark?MINT:'#5f8f7b')}</div>`;
}
function render(){
  if(S.view){screen.className='app'+(S.size==='se'?' se':'');screen.innerHTML=`<div class="sb" style="${S.view==='splash'&&S.splash==='G'?'color:#fff':''}"><span>9:41</span><span class="island"></span><span>●●● ▮</span></div>${S.view==='spring'?springboard():splash()}<div class="toast" id="toast"></div>`;drawRail();fit();return}
  const pg=page();
  const inner=pg?PAGES[pg.t](pg):[home,agreementsTab,tracker,profile][S.tab]();
  screen.className='app'+(S.size==='se'?' se':'');
  screen.innerHTML=`<div class="sb"><span>9:41</span><span class="island"></span><span>●●● ▮</span></div><div class="body" id="body">${inner}</div><nav class="nav">${['Home','Agreements','Tracker','Profile'].map((n,i)=>`<button data-tab="${i}" ${!pg&&S.tab===i?'aria-current="page"':''}><span class="ic">${ic(['home','doc','chart','user'][i])}</span>${n}</button>`).join('')}</nav><div class="toast" id="toast"></div>`;
  drawRail(); fit();
}
let tt; function say(m){const t=document.getElementById('toast');if(!t)return;t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),2400)}

screen.addEventListener('change',e=>{const t=e.target;if(!S.d)return;S.d.err='';
  if(t.id==='d-title')S.d.title=t.value.trim();
  if(t.id==='d-total')S.d.total=Math.max(0,Math.round(+t.value||0));
  if(t.dataset.share!==undefined)S.d.people[+t.dataset.share].share=Math.max(0,Math.round(+t.value||0));
  render();});
screen.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.dataset.tab!==undefined){S.tab=+b.dataset.tab;S.pages=[];S.filt='all';return render()}
  if(b.dataset.sec) return open({t:'section',k:b.dataset.sec});
  if(b.dataset.ag) return open({t:'agreement',id:b.dataset.ag});
  if(b.dataset.kind){S.kind=b.dataset.kind;return render()}
  if(b.dataset.evt){S.evt=b.dataset.evt;return render()}
  if(S.d&&['addp','rmp','role','split'].includes(b.dataset.act))S.d.err='';
  if(b.dataset.lf){S.filt=b.dataset.lf;return render()}
  const a=b.dataset.act;
  if(a==='launch'){S.view='splash';render();clearTimeout(S.lt);S.lt=setTimeout(()=>{S.view=null;reset();render()},1600);return}
  switch(a){
    case 'back':return back();
    case 'profile':S.tab=3;S.pages=[];return render();
    case 'retry':S.scen='normal';return render();
    case 'create':return open({t:'create'});
    case 'cont':if(!S.kind)return say('Choose a type first.');newDraft();return open({t:'details'});
    case 'addp':{const next=PEOPLE.find(n=>!S.d.people.some(x=>x.name===n));if(!next)return say('Everyone in this demo is already added.');S.d.people.push({name:next,role:'owes',share:0,paid:0});return render()}
    case 'rmp':S.d.people.splice(+b.dataset.i,1);return render();
    case 'role':{const x=S.d.people[+b.dataset.i];if(x.you){x.role=x.role==='owes'?'owed':'owes';render();return say('You can’t be the witness on your own agreement. A witness is someone else.')}x.role=ROLES[(ROLES.indexOf(x.role)+1)%3];return render()}
    case 'split':S.d.split=b.dataset.v;return render();
    case 'verify':return open({t:'verify'});
    case 'addev':S.evt=null;return open({t:'addev',id:page().id});
    case 'pickev':{if(!S.evt)return say('Choose what you are adding first.');const a=S.list.find(x=>x.id===page().id);const L=evOf(a);
      if(L.length>=25)return say('This agreement has 25 files, the most it can hold.');
      L.push({t:S.evt,name:EVT[S.evt][0]+' '+(L.length+1),mb:+(0.4+Math.random()*3).toFixed(1),on:'10 Nov'});S.pages.pop();render();return say('Demo: file added. In the real app you choose it from your phone.')}
    case 'rmev':{const a=S.list.find(x=>x.id===page().id);evOf(a).splice(+b.dataset.i,1);return render()}
    case 'myrecord':return open({t:'record',me:true});
    case 'other':{const n=b.dataset.n;if(!TR[n].shared)return say(n.split(' ')[0]+' hasn’t shared a track record.');return open({t:'record',name:n})}
    case 'trshare':TR['Amina Noor'].shared=!TR['Amina Noor'].shared;render();return say(TR['Amina Noor'].shared?'People on your agreements can now see your track record.':'Your track record is private again.');
    case 'vdo':{const k=b.dataset.k;if(k==='id'){S.ver.id=true;S.ver.selfie=true}else S.ver[k]=true;render();return say(k==='id'||k==='selfie'?'Demo: identity checked. In the real app a specialist ID company does this.':'Demo: confirmed. In the real app you enter a code we send you.')}
    case 'vreset':S.ver={email:true,phone:false,id:false,selfie:false};return render();
    case 'date':return say('Opens the date picker, as in the app.');
    case 'review':{const e=draftError();if(e){S.d.err=e;return render()}return open({t:'review'})}
    case 'save':{const a=saveDraft();S.pages=[];S.tab=0;open({t:'agreement',id:a.id});return say('Draft saved. Send it when everyone’s details are right.')}
    case 'payby':return open({t:'payby',id:page().id});
    case 'paid':{const ag=S.list.find(x=>x.id===page().id);const x=ag.people[+b.dataset.i];const add=Math.min(50,x.share-x.paid-(x.pending||0));if(add<=0)return;x.pending=(x.pending||0)+add;ag.pend.push({from:x.you?'you':x.name.split(' ')[0],i:+b.dataset.i,amt:add,on:fmt(TODAY)});S.pages.pop();render();return say(`£${add} from ${x.you?'you':x.name.split(' ')[0]} recorded. It counts once ${owedName(ag)} confirms.`)}
    case 'pconf':case 'pdemo':{const ag=S.list.find(x=>x.id===page().id);const [q]=ag.pend.splice(+b.dataset.i,1);ag.paid=Math.min(ag.amt,ag.paid+q.amt);if(ag.people&&q.i!=null){const x=ag.people[q.i];x.pending-=q.amt;x.paid+=q.amt}if(ag.paid>=ag.amt)ag.status='completed';render();return say(ag.status==='completed'?'Confirmed. Everything is paid, so the agreement is complete.':`Confirmed. ${gbp(q.amt)} now counts as paid.`)}
    case 'prej':{const ag=S.list.find(x=>x.id===page().id);const [q]=ag.pend.splice(+b.dataset.i,1);render();return say(`Marked as not received. ${q.from} is told (example).`)}
    case 'fullpaid':{const ag=S.list.find(x=>x.id===page().id);ag.pend=[];ag.paid=ag.amt;ag.status='completed';render();return say('Marked as paid in full. The agreement is complete.')}
    case 'invites':return say('Invitations are already in the app. Not redrawn here yet.');
    case 'invite':S.invite=false;render();return say('Opens Invitations (already in the app). Removed from Needs you for this demo.');
    case 'docview':return say('The agreement copy is already in the app. Not redrawn here yet.');
    case 'remind':{const ag=S.list.find(x=>x.id===page().id);return say(`Reminder sent to ${ag.who.split(' ')[0]} (example).`)}
    case 'sign':{const ag=S.list.find(x=>x.id===page().id);ag.status='active';render();return say('Signed. The agreement is now active.')}
    case 'send':{const ag=S.list.find(x=>x.id===page().id);ag.status='awaiting';render();return say('Sent. Waiting for signatures.')}
    case 'pay':{if(S.list.find(x=>x.id===page().id).people)return open({t:'payby',id:page().id});const ag=S.list.find(x=>x.id===page().id);ag.paid=Math.min(ag.amt,ag.paid+50);if(ag.paid===ag.amt)ag.status='completed';render();return say(ag.owedByYou?'£50 recorded. You are owed, so it counts straight away.':'£50 recorded (example).')}
    default:return say('Not part of this design yet.');
  }
});
document.getElementById('backout').onclick=back;

/* ---------- rail ---------- */
const STATES=[['normal','Example records'],['calm','Nothing needs you'],['empty','New member (no agreements)'],['loading','Loading'],['error','Couldn’t load']];
function drawRail(){
  document.getElementById('flows').innerHTML=[['app','Wafa app'],['home','Phone home screen']].map(([k,l])=>`<button data-flow="${k}" aria-pressed="${(k==='home')===(S.view==='spring')}">${l}</button>`).join('');
  const st=document.getElementById('states');st.hidden=!!S.view;
  st.innerHTML='<b>Try</b>'+STATES.map(([k,l])=>`<button data-s="${k}" aria-pressed="${S.scen===k}">${l}</button>`).join('');
  document.getElementById('uopt').hidden=true;
}
const reset=()=>{S.list=BASE.map(a=>({...a,pend:(a.pend||[]).map(x=>({...x})),people:a.people?a.people.map(x=>({...x,pending:0})):undefined}));S.ev=JSON.parse(JSON.stringify(EV0));S.tab=0;S.pages=[];S.filt='all';S.invite=S.scen!=='calm'};
document.querySelector('.bar').addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.id==='backout')return;
  if(b.dataset.flow){clearTimeout(S.lt);S.view=b.dataset.flow==='home'?'spring':null}
  if(b.dataset.s){S.scen=b.dataset.s;S.view=null;reset()}
  render();});

/* ---------- scale phone to fit ---------- */
function fit(){
  const dev=document.getElementById('dev'),w=(S.size==='se'?375:430)+24,h=(S.size==='se'?667:932)+24;
  dev.style.width=(w-24)+'px';dev.style.height=(h-24)+'px';
  const avail=Math.min(window.innerWidth-32,w), availH=Math.max(window.innerHeight-document.querySelector('.bar').offsetHeight-48,420);
  const s=Math.min(1,avail/w,availH/h);
  dev.style.transform=`scale(${s})`;
  const f=document.getElementById('fit');f.style.width=w*s+'px';f.style.height=h*s+'px';
}
window.addEventListener('resize',fit);
reset(); render();
</script>
